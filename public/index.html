<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jasell — כניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Heebo', sans-serif; }
  :root {
    --primary: var(--color-brand);
    --accent:  var(--color-accent);
    --bg:      var(--color-bg);
    --white:   var(--color-surface);
  }
  body {
    font-family: 'Poppins', 'Heebo', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-md);
    padding: 44px 40px;
    width: 100%;
    max-width: 420px;
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo img { height: 72px; }
  .logo-text {
    font-size: 2rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -1px;
  }
  .logo-sub {
    font-size: .85rem;
    color: #9b93b0;
    margin-top: 4px;
  }
  label {
    display: block;
    font-size: .85rem;
    font-weight: 700;
    color: #3d3352;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: .95rem;
    color: #1a1028;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 18px;
    text-align: right;
    direction: ltr;
  }
  input:focus { border-color: var(--primary); }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    margin-top: 4px;
  }
  .btn:hover { opacity: .92; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .error {
    display: none;
    background: #fff0f6;
    border: 1.5px solid #ff66c4;
    color: #c0006a;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .85rem;
    margin-bottom: 14px;
  }
</style>
<script src="/i18n.js"></script>
<script>
// Already logged in → straight to the right surface (keeps push-notification
// deep links like /dashboard.html?tab=orders working when no tab is open)
(function () {
  const t = localStorage.getItem('token');
  const r = localStorage.getItem('role');
  if (!t) return;
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab');
  const dest = r === 'vendor' ? '/admin' : r === 'kitchen' ? '/kitchen'
    : '/dashboard.html' + (tab ? `?tab=${encodeURIComponent(tab)}` : '');
  window.location.replace(dest);
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <div style="width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 12px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 11h.01"/><path d="M11 15h.01"/><path d="M16 16h.01"/><path d="m2 16 20 6-6-20A20 20 0 0 0 2 16"/></svg>
    </div>
    <div class="logo-text" style="display:block">Jasell</div>
    <div class="logo-sub" data-i18n="logo_sub">ממשק ניהול</div>
  </div>

  <button onclick="toggleLang()" type="button" data-i18n="lang_toggle"
    style="position:absolute;top:16px;inset-inline-end:16px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border,#e5e7eb);background:#fff;cursor:pointer;font-size:.7rem;font-weight:800;color:#4b5563;font-family:inherit">EN</button>

  <form id="loginForm">
    <label data-tr>שם משתמש</label>
    <input type="text" id="username" required autocomplete="username" placeholder="שם משתמש" data-tr-placeholder dir="ltr">
    <label data-tr>סיסמא</label>
    <input type="password" id="password" required autocomplete="current-password">
    <div class="error" id="errorMsg"></div>
    <button type="submit" class="btn" id="submitBtn" data-tr>כניסה</button>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');

  btn.disabled = true;
  btn.textContent = (typeof tr==='function'?tr('מתחבר...'):'מתחבר...');
  errorMsg.style.display = 'none';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || (typeof tr==='function'?tr('שגיאת כניסה'):'שגיאת כניסה'));
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    localStorage.setItem('username', data.username);
    // The tenant's language, as a DEFAULT. An operator who pressed the toggle
    // keeps their choice; a fresh browser at an American business now opens the
    // dashboard in English instead of Hebrew RTL.
    if (typeof setTenantLang === 'function') setTenantLang(data.lang);
    const dest = data.role === 'vendor' ? '/admin' : data.role === 'kitchen' ? '/kitchen' : '/dashboard.html';
    window.location.href = dest;
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = (typeof tr==='function'?tr('כניסה'):'כניסה');
  }
});
</script>
</body>
</html>
