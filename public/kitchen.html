<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חלון מטבח — Jasell</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<script src="/i18n.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  background: var(--color-bg);
  color: var(--color-text);
  min-height: 100vh;
}

/* ── Header (dark on purpose — KDS contrast, exempt from the light chrome) ── */
.header {
  background: #111827;
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.logo-chip {
  width: 30px; height: 30px; border-radius: var(--radius-md); flex-shrink: 0;
  background: linear-gradient(135deg, var(--color-brand), #2563eb);
  display: flex; align-items: center; justify-content: center; color: #fff;
}
.header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: .3px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.status-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #ef4444;
  transition: background .3s;
}
.status-dot.connected { background: #22c55e; }
.status-label { font-size: .78rem; color: #9ca3af; }
.logout-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.1); border: none; color: #fff;
  padding: 7px 14px; border-radius: var(--radius-md); cursor: pointer;
  font-size: .8rem; font-weight: 600; font-family: inherit;
  transition: background .15s;
}
.logout-btn:hover { background: rgba(255,255,255,.18); }

/* ── Columns ── */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
}
@media (max-width: 768px) {
  .board { grid-template-columns: 1fr; }
}

.column {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.column-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: .85rem;
}
.column-header svg { flex-shrink: 0; }
.col-new     .column-header { background: #fef3c7; color: #92400e; }
.col-prep    .column-header { background: #dbeafe; color: #1e40af; }
.col-ready   .column-header { background: #dcfce7; color: #166534; }

.col-badge {
  margin-right: auto;
  background: rgba(0,0,0,.12);
  border-radius: var(--radius-full);
  padding: 1px 8px;
  font-size: .75rem;
}

/* ── Order card ── */
.order-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  border-top: 4px solid transparent;
  animation: slideIn .25s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.col-new   .order-card { border-top-color: #f59e0b; }
.col-prep  .order-card { border-top-color: #3b82f6; }
.col-ready .order-card { border-top-color: #22c55e; }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-num {
  font-weight: 800;
  font-size: 1.9rem;
  color: var(--color-text);
}
.card-timer {
  font-size: 1.05rem;
  font-weight: 800;
  color: #94a3b8;
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 999px;
}
.card-timer.urgent { color: #ef4444; background: #fee2e2; }

.card-method {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .95rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  margin-bottom: 10px;
}
.method-delivery { background: #e0f0ff; color: #005faa; }
.method-pickup   { background: #f0f0f0; color: #555; }

.card-items {
  list-style: none;
  font-size: 1.35rem;
  font-weight: 700;
  line-height: 1.6;
  margin-bottom: 10px;
  color: #374151;
}
.card-items li { padding: 8px 0; border-bottom: 1px dashed #f1f5f9; }
.card-items li:last-child { border-bottom: none; }
.item-qty { font-weight: 700; color: #1a1a2e; margin-left: 4px; }
.item-toppings { font-size: 1rem; color: #6b7280; margin-right: 8px; }

.card-notes {
  font-size: 1.1rem;
  font-weight: 600;
  background: #fffbeb;
  border: 1.5px solid #fde68a;
  border-radius: var(--radius-md);
  padding: 6px 10px;
  color: #78350f;
  margin-bottom: 10px;
  display: flex; align-items: baseline; gap: 6px;
}
.card-notes svg { flex-shrink: 0; align-self: center; }

.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-action {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 18px 16px;
  border: none;
  border-radius: var(--radius-lg);
  font-size: 1.3rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn-action:hover { opacity: .88; }
.btn-action:active { transform: scale(.97); }
.btn-action:disabled { opacity: .45; cursor: not-allowed; }

.btn-prep  { background: #3b82f6; color: #fff; }
.btn-ready { background: #22c55e; color: #fff; }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 32px 16px;
  color: #94a3b8;
  font-size: .85rem;
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: #fff;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 600;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  z-index: 100;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo-chip">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 11h.01"/><path d="M11 15h.01"/><path d="M16 16h.01"/><path d="m2 16 20 6-6-20A20 20 0 0 0 2 16"/></svg>
    </div>
    <div class="header-title" data-i18n="title_kitchen">חלון מטבח</div>
  </div>
  <div class="header-right">
    <span class="status-dot" id="dot"></span>
    <span class="status-label" id="connLabel" data-tr>מתחבר…</span>
    <button onclick="toggleLang()" class="logout-btn" style="padding:7px 10px;font-size:.68rem" data-i18n="lang_toggle">EN</button>
    <button onclick="logout()" class="logout-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span data-i18n="nav_logout">יציאה</span></button>
  </div>
</div>

<div class="board">
  <div class="column col-new">
    <div class="column-header">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span data-tr>ממתינות לאישור</span> <span class="col-badge" id="badge-new">0</span></div>
    <div id="col-new"></div>
  </div>
  <div class="column col-prep">
    <div class="column-header">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      <span data-tr>בהכנה</span> <span class="col-badge" id="badge-preparing">0</span></div>
    <div id="col-preparing"></div>
  </div>
  <div class="column col-ready">
    <div class="column-header">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span data-tr>מוכן</span> <span class="col-badge" id="badge-ready">0</span></div>
    <div id="col-ready"></div>
  </div>
</div>

<div id="toast"></div>

<script src="kitchen.js"></script>
</body>
</html>
